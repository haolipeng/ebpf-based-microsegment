syntax = "proto3";

package microsegment.agent;

import "common/common.proto";

option go_package = "github.com/haolipeng/ebpf-based-microsegment/api/proto/agent";

// AgentService handles agent lifecycle management
service AgentService {
  // RegisterAgent registers a new agent with the server
  // Called when agent starts up
  rpc RegisterAgent(RegisterRequest) returns (RegisterResponse);

  // Heartbeat sends periodic health and metrics updates
  // Agents should call this every 30-60 seconds
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);

  // ReportStatus sends detailed status information
  // Called when agent state changes or on demand
  rpc ReportStatus(StatusReport) returns (StatusResponse);

  // UnregisterAgent removes agent registration
  // Called during graceful shutdown
  rpc UnregisterAgent(UnregisterRequest) returns (UnregisterResponse);
}

// RegisterRequest is sent when an agent first connects to the server
message RegisterRequest {
  // Unique agent ID (typically hostname or UUID)
  string agent_id = 1;

  // Hostname of the machine running the agent
  string hostname = 2;

  // Agent version (e.g., "1.0.0")
  string version = 3;

  // Network interface being monitored
  string interface = 4;

  // IP addresses on this host
  repeated string ip_addresses = 5;

  // Operating system (e.g., "Linux", "Ubuntu 22.04")
  string os = 6;

  // Kernel version (e.g., "5.15.0-58-generic")
  string kernel_version = 7;

  // Agent start time (Unix nanoseconds)
  int64 start_time = 8;

  // Agent capabilities (features supported)
  AgentCapabilities capabilities = 9;
}

// AgentCapabilities describes features supported by the agent
message AgentCapabilities {
  // Supports eBPF flow tracking
  bool flow_tracking = 1;

  // Supports policy enforcement in eBPF
  bool policy_enforcement = 2;

  // Supports label-based policies
  bool label_based_policies = 3;

  // Supports streaming flow events
  bool flow_streaming = 4;

  // Supports policy statistics reporting
  bool policy_stats = 5;

  // Supports IPv6
  bool ipv6_support = 6;
}

// RegisterResponse is the server's response to agent registration
message RegisterResponse {
  // Whether registration was successful
  bool success = 1;

  // Human-readable message (error details or welcome message)
  string message = 2;

  // Server version (e.g., "1.0.0")
  string server_version = 3;

  // Server timestamp (Unix nanoseconds)
  int64 server_time = 4;

  // Configuration for the agent
  AgentConfig config = 5;
}

// AgentConfig contains configuration parameters for the agent
message AgentConfig {
  // Heartbeat interval in seconds (default: 30)
  uint32 heartbeat_interval = 1;

  // Statistics reporting interval in seconds (default: 60)
  uint32 stats_interval = 2;

  // Flow batch size for streaming (default: 100)
  uint32 flow_batch_size = 3;

  // Flow batch timeout in seconds (default: 5)
  uint32 flow_batch_timeout = 4;

  // Enable debug logging
  bool debug_mode = 5;

  // Custom configuration parameters
  map<string, string> custom_config = 6;
}

// HeartbeatRequest is sent periodically by agents
message HeartbeatRequest {
  // Agent ID
  string agent_id = 1;

  // Heartbeat timestamp (Unix nanoseconds)
  int64 timestamp = 2;

  // Current agent metrics (lightweight)
  AgentMetrics metrics = 3;
}

// AgentMetrics contains lightweight metrics for heartbeats
message AgentMetrics {
  // CPU usage percentage (0-100)
  float cpu_usage = 1;

  // Memory usage in bytes
  uint64 memory_usage = 2;

  // Number of packets processed since last heartbeat
  uint64 packets_processed = 3;

  // Number of active network sessions/connections
  uint32 active_sessions = 4;

  // Number of flows reported since last heartbeat
  uint64 flows_reported = 5;

  // Number of active policies
  uint32 active_policies = 6;
}

// HeartbeatResponse is the server's response to heartbeat
message HeartbeatResponse {
  // Whether agent is healthy from server perspective
  bool healthy = 1;

  // Human-readable message (warnings or instructions)
  string message = 2;

  // Commands for the agent to execute (optional)
  repeated AgentCommand commands = 3;

  // Server timestamp (Unix nanoseconds)
  int64 server_time = 4;
}

// AgentCommand represents a command from server to agent
message AgentCommand {
  // Command type
  AgentCommandType command_type = 1;

  // Unique command ID for tracking execution
  string command_id = 2;

  // Command parameters (command-specific)
  map<string, string> parameters = 3;

  // Command timeout in seconds
  uint32 timeout = 4;
}

// AgentCommandType defines available agent commands
enum AgentCommandType {
  // Unknown command
  COMMAND_UNKNOWN = 0;

  // Request full policy sync
  COMMAND_SYNC_POLICIES = 1;

  // Request full status report
  COMMAND_REPORT_STATUS = 2;

  // Reload configuration
  COMMAND_RELOAD_CONFIG = 3;

  // Restart agent
  COMMAND_RESTART = 4;

  // Shutdown agent
  COMMAND_SHUTDOWN = 5;

  // Enable debug mode
  COMMAND_ENABLE_DEBUG = 6;

  // Disable debug mode
  COMMAND_DISABLE_DEBUG = 7;
}

// StatusReport contains detailed agent status
message StatusReport {
  // Agent ID
  string agent_id = 1;

  // Report timestamp (Unix nanoseconds)
  int64 timestamp = 2;

  // Current agent status
  AgentStatus status = 3;

  // Agent uptime in seconds
  uint64 uptime = 4;

  // Detailed metrics
  AgentMetrics metrics = 5;

  // Number of policy rules currently enforced
  uint32 policy_count = 6;

  // Current policy version
  uint64 policy_version = 7;

  // Number of workloads registered on this host
  uint32 workload_count = 8;

  // Error messages or warnings (if any)
  repeated string errors = 9;

  // Additional status information
  map<string, string> metadata = 10;
}

// AgentStatus represents the current state of an agent
enum AgentStatus {
  // Unknown status
  STATUS_UNKNOWN = 0;

  // Agent is starting up
  STATUS_STARTING = 1;

  // Agent is running normally
  STATUS_RUNNING = 2;

  // Agent is degraded (some features not working)
  STATUS_DEGRADED = 3;

  // Agent is stopping
  STATUS_STOPPING = 4;

  // Agent has encountered an error
  STATUS_ERROR = 5;
}

// StatusResponse is the server's acknowledgment of status report
message StatusResponse {
  // Whether status was received successfully
  bool success = 1;

  // Human-readable message
  string message = 2;

  // Commands to execute (if server needs agent to take action)
  repeated AgentCommand commands = 3;
}

// UnregisterRequest is sent when agent is shutting down
message UnregisterRequest {
  // Agent ID to unregister
  string agent_id = 1;

  // Reason for unregistering
  string reason = 2;

  // Timestamp (Unix nanoseconds)
  int64 timestamp = 3;
}

// UnregisterResponse acknowledges agent unregistration
message UnregisterResponse {
  // Whether unregistration was successful
  bool success = 1;

  // Human-readable message
  string message = 2;
}
