# Microsegmentation Agent Configuration (Docker 版本)
#
# The agent reports all flow data to a central control plane server
# via gRPC for centralized policy management and monitoring.

# Network interface to attach eBPF program
# Docker 容器中,通常使用 eth0
interface: eth0

# Log level: debug, info, warn, error
log_level: info

# Statistics print interval in seconds
stats_interval: 30

# API server configuration (local queries and management)
api:
  # Enable REST API server for local queries
  enabled: true

  # API server host (0.0.0.0 允许外部访问)
  host: 0.0.0.0

  # API server port
  port: 8081

  # Enable CORS support
  enable_cors: true

# Control plane server configuration (required)
server:
  # gRPC server address (host:port)
  # Docker 环境中,Agent 使用 host 网络模式,所以可以通过 localhost 访问 Server
  server_addr: "${SERVER_ADDR:localhost:9090}"

  # Unique agent identifier
  # If not specified, will be auto-generated from hostname
  # agent_id: "agent-docker"

  # Number of flow events to batch before sending to server
  # Higher values reduce network overhead but increase latency
  batch_size: 100

  # Maximum time to wait before sending a partial batch
  # Ensures flows are not delayed too long
  batch_timeout: 5s

  # Time to wait before attempting to reconnect on server failure
  reconnect_interval: 30s

# Flow collection configuration
flow:
  # Enable flow data collection and storage
  enabled: true

  # Path to SQLite database for flow storage
  storage_path: "/var/lib/microsegment/flows.db"

  # Duration after which inactive flows are considered closed
  flow_timeout: 5m

  # Interval for cleaning up inactive flows from memory
  cleanup_interval: 1m

  # Number of days to retain historical flow data
  # Older flows are automatically deleted
  retention_days: 7
