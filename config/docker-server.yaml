server:
  host: "0.0.0.0"
  port: 8080

grpc:
  host: "0.0.0.0"
  port: 9090

database:
  # Docker 环境中,使用环境变量配置数据库连接
  # 这些值会被 Docker Compose 中的环境变量覆盖
  host: "${DB_HOST:postgres}"
  port: ${DB_PORT:5432}
  user: "${DB_USER:microsegment_user}"
  password: "${DB_PASSWORD:secret}"
  dbname: "${DB_NAME:microsegment}"
  sslmode: "disable"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: "5m"

log:
  level: "info"  # debug, info, warn, error
  format: "json"  # json, text
