# Agent 配置示例 - XDP 数据平面模式

# 网络接口
interface: eth0

# 日志级别 (debug | info | warn | error)
log_level: info

# 统计信息打印间隔（秒）
stats_interval: 30

# 运行模式 (agent-server | standalone)
mode: agent-server

# API 服务配置
api:
  enabled: true
  host: 127.0.0.1
  port: 8080
  enable_cors: true

# 数据平面（eBPF）配置
dataplane:
  # 模式选择：
  # - auto: 自动选择最佳模式（推荐）
  # - xdp-native: 强制 Native XDP（需驱动支持）
  # - xdp-generic: 强制 Generic XDP（内核回退）
  # - tc: 强制 TC（TCX 或 Legacy）
  mode: auto

  # 优先使用 XDP（在 auto 模式下）
  prefer_xdp: true

  # 允许 Generic XDP 回退
  allow_generic_xdp: true

# 流量收集配置
flow:
  enabled: true
  storage_path: ./data/flows.db
  flow_timeout: 5m
  cleanup_interval: 1m
  retention_days: 7

# Server 连接配置（agent-server 模式）
server:
  server_addr: "localhost:9090"
  agent_id: ""  # 留空自动生成
  batch_size: 100
  batch_timeout: 5s
  reconnect_interval: 30s
  max_retries: 3
  retry_base_delay: 1s
  retry_max_delay: 30s
