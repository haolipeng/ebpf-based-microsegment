# External API Simulator
events {
    worker_connections 256;
}

http {
    server {
        listen 80;
        server_name localhost;

        location /health {
            return 200 '{"status":"healthy","service":"external-api"}';
            add_header Content-Type application/json;
        }

        location /api/ {
            return 200 '{"source":"external","message":"External API response"}';
            add_header Content-Type application/json;
        }

        location / {
            return 200 '{"service":"external-api-simulator"}';
            add_header Content-Type application/json;
        }
    }
}
