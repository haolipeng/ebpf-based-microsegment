# Docker Test Environment for Network Topology Visualization
#
# Architecture:
#   ┌─────────────────────────────────────────────────────────────────┐
#   │                        frontend-network                          │
#   │  ┌──────────┐    ┌──────────┐    ┌──────────────────────────┐   │
#   │  │  nginx   │───▶│ frontend │    │      load-balancer       │   │
#   │  │ (gateway)│    │  (web)   │    │       (traefik)          │   │
#   │  └──────────┘    └──────────┘    └──────────────────────────┘   │
#   └────────────────────────┬────────────────────────────────────────┘
#                            │
#   ┌────────────────────────┼────────────────────────────────────────┐
#   │                    backend-network                               │
#   │  ┌──────────┐    ┌──────────┐    ┌──────────┐    ┌──────────┐  │
#   │  │  api-1   │    │  api-2   │    │  worker  │    │  cache   │  │
#   │  │ (python) │    │ (python) │    │ (python) │    │ (redis)  │  │
#   │  └────┬─────┘    └────┬─────┘    └────┬─────┘    └──────────┘  │
#   │       │               │               │                         │
#   └───────┼───────────────┼───────────────┼─────────────────────────┘
#           │               │               │
#   ┌───────┼───────────────┼───────────────┼─────────────────────────┐
#   │       │          data-network         │                         │
#   │  ┌────┴─────┐    ┌──────────┐    ┌────┴─────┐                   │
#   │  │   db     │    │  queue   │    │  search  │                   │
#   │  │(postgres)│    │(rabbitmq)│    │(elastic) │                   │
#   │  └──────────┘    └──────────┘    └──────────┘                   │
#   └─────────────────────────────────────────────────────────────────┘

version: '3.8'

networks:
  frontend-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
    labels:
      - "app.tier=frontend"
      - "app.environment=test"

  backend-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/24
    labels:
      - "app.tier=backend"
      - "app.environment=test"

  data-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
    labels:
      - "app.tier=data"
      - "app.environment=test"

services:
  # ============================================
  # Frontend Tier
  # ============================================

  nginx-gateway:
    image: nginx:alpine
    container_name: nginx-gateway
    hostname: nginx-gateway
    networks:
      frontend-network:
        ipv4_address: 172.28.0.10
    ports:
      - "8888:80"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
    labels:
      - "app=nginx"
      - "service=gateway"
      - "tier=frontend"
      - "version=1.0"
    depends_on:
      - api-service-1
      - api-service-2
    restart: unless-stopped

  web-frontend:
    image: nginx:alpine
    container_name: web-frontend
    hostname: web-frontend
    networks:
      frontend-network:
        ipv4_address: 172.28.0.11
    volumes:
      - ./config/frontend.conf:/etc/nginx/nginx.conf:ro
      - ./html:/usr/share/nginx/html:ro
    labels:
      - "app=frontend"
      - "service=web"
      - "tier=frontend"
      - "version=1.0"
    restart: unless-stopped

  # ============================================
  # Backend Tier - API Services
  # ============================================

  api-service-1:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: api-service-1
    hostname: api-service-1
    networks:
      frontend-network:
        ipv4_address: 172.28.0.20
      backend-network:
        ipv4_address: 172.29.0.20
    environment:
      - SERVICE_NAME=api-1
      - SERVICE_PORT=8080
      - REDIS_HOST=redis-cache
      - REDIS_PORT=6379
      - DB_HOST=postgres-db
      - DB_PORT=5432
      - RABBITMQ_HOST=rabbitmq
    labels:
      - "app=api"
      - "service=api-service"
      - "tier=backend"
      - "version=1.0"
      - "instance=1"
    depends_on:
      - redis-cache
      - postgres-db
    restart: unless-stopped

  api-service-2:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: api-service-2
    hostname: api-service-2
    networks:
      frontend-network:
        ipv4_address: 172.28.0.21
      backend-network:
        ipv4_address: 172.29.0.21
    environment:
      - SERVICE_NAME=api-2
      - SERVICE_PORT=8080
      - REDIS_HOST=redis-cache
      - REDIS_PORT=6379
      - DB_HOST=postgres-db
      - DB_PORT=5432
      - RABBITMQ_HOST=rabbitmq
    labels:
      - "app=api"
      - "service=api-service"
      - "tier=backend"
      - "version=1.0"
      - "instance=2"
    depends_on:
      - redis-cache
      - postgres-db
    restart: unless-stopped

  # ============================================
  # Backend Tier - Worker Services
  # ============================================

  worker-service:
    build:
      context: ./services/worker
      dockerfile: Dockerfile
    container_name: worker-service
    hostname: worker-service
    networks:
      backend-network:
        ipv4_address: 172.29.0.30
      data-network:
        ipv4_address: 172.30.0.30
    environment:
      - SERVICE_NAME=worker
      - REDIS_HOST=redis-cache
      - REDIS_PORT=6379
      - DB_HOST=postgres-db
      - DB_PORT=5432
      - RABBITMQ_HOST=rabbitmq
      - ES_HOST=elasticsearch
    labels:
      - "app=worker"
      - "service=worker-service"
      - "tier=backend"
      - "version=1.0"
    depends_on:
      - rabbitmq
      - postgres-db
    restart: unless-stopped

  # ============================================
  # Cache Layer
  # ============================================

  redis-cache:
    image: redis:7-alpine
    container_name: redis-cache
    hostname: redis-cache
    networks:
      backend-network:
        ipv4_address: 172.29.0.40
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    labels:
      - "app=redis"
      - "service=cache"
      - "tier=data"
      - "version=7.0"
    restart: unless-stopped

  # ============================================
  # Data Tier
  # ============================================

  postgres-db:
    image: postgres:15-alpine
    container_name: postgres-db
    hostname: postgres-db
    networks:
      data-network:
        ipv4_address: 172.30.0.10
    environment:
      - POSTGRES_USER=testuser
      - POSTGRES_PASSWORD=testpass
      - POSTGRES_DB=testdb
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d:ro
    labels:
      - "app=postgres"
      - "service=database"
      - "tier=data"
      - "version=15"
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    hostname: rabbitmq
    networks:
      backend-network:
        ipv4_address: 172.29.0.50
      data-network:
        ipv4_address: 172.30.0.50
    ports:
      - "15672:15672"  # Management UI
    environment:
      - RABBITMQ_DEFAULT_USER=testuser
      - RABBITMQ_DEFAULT_PASS=testpass
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    labels:
      - "app=rabbitmq"
      - "service=queue"
      - "tier=data"
      - "version=3.0"
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: elasticsearch
    hostname: elasticsearch
    networks:
      data-network:
        ipv4_address: 172.30.0.20
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms256m -Xmx256m"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    labels:
      - "app=elasticsearch"
      - "service=search"
      - "tier=data"
      - "version=8.11"
    restart: unless-stopped

  # ============================================
  # Traffic Generators (for testing)
  # ============================================

  traffic-generator:
    build:
      context: ./services/traffic-gen
      dockerfile: Dockerfile
    container_name: traffic-generator
    hostname: traffic-generator
    networks:
      frontend-network:
        ipv4_address: 172.28.0.100
      backend-network:
        ipv4_address: 172.29.0.100
    environment:
      - TARGET_HOSTS=nginx-gateway,api-service-1,api-service-2,redis-cache
      - INTERVAL=2
      - CONCURRENT=5
    labels:
      - "app=traffic-gen"
      - "service=testing"
      - "tier=test"
    depends_on:
      - nginx-gateway
      - api-service-1
      - api-service-2
    restart: unless-stopped

  # External service simulator (simulates external API calls)
  external-api:
    image: nginx:alpine
    container_name: external-api
    hostname: external-api
    networks:
      frontend-network:
        ipv4_address: 172.28.0.200
    volumes:
      - ./config/external.conf:/etc/nginx/nginx.conf:ro
    labels:
      - "app=external"
      - "service=external-api"
      - "tier=external"
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  es-data:
