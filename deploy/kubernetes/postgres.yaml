# PostgreSQL Deployment (single replica for testing)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: microsegment-postgres
  namespace: microsegment
  labels:
    app: microsegment-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: microsegment-postgres
  template:
    metadata:
      labels:
        app: microsegment-postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_DB
          value: "microsegment"
        - name: POSTGRES_USER
          value: "microsegment_user"
        - name: POSTGRES_PASSWORD
          value: "secret"
        - name: PGDATA
          value: "/var/lib/postgresql/data/pgdata"
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: postgres-data
        emptyDir: {}  # For testing only - data will be lost on pod restart
---
# PostgreSQL Service
apiVersion: v1
kind: Service
metadata:
  name: microsegment-postgres
  namespace: microsegment
  labels:
    app: microsegment-postgres
spec:
  type: ClusterIP
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
    name: postgres
  selector:
    app: microsegment-postgres
