# Server Deployment (single replica for testing)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: microsegment-server
  namespace: microsegment
  labels:
    app: microsegment-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: microsegment-server
  template:
    metadata:
      labels:
        app: microsegment-server
    spec:
      initContainers:
      # Wait for PostgreSQL to be ready
      - name: wait-for-postgres
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z microsegment-postgres 5432; do echo waiting for postgres; sleep 2; done;']
      containers:
      - name: server
        image: microsegment-server:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 9090
          name: grpc
        env:
        - name: DB_HOST
          value: "microsegment-postgres"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: "microsegment"
        - name: DB_USER
          value: "microsegment_user"
        - name: DB_PASSWORD
          value: "secret"
        - name: HTTP_PORT
          value: "8080"
        - name: GRPC_PORT
          value: "9090"
        - name: LOG_LEVEL
          value: "info"
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        # Health check endpoints (if implemented in server)
        # livenessProbe:
        #   httpGet:
        #     path: /health
        #     port: 8080
        #   initialDelaySeconds: 30
        #   periodSeconds: 10
        # readinessProbe:
        #   httpGet:
        #     path: /ready
        #     port: 8080
        #   initialDelaySeconds: 10
        #   periodSeconds: 5
---
# Server Service
apiVersion: v1
kind: Service
metadata:
  name: microsegment-server
  namespace: microsegment
  labels:
    app: microsegment-server
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  - port: 9090
    targetPort: 9090
    protocol: TCP
    name: grpc
  selector:
    app: microsegment-server
