# Microsegment Agent - Standalone Mode Configuration
# In this mode, agent runs independently without connecting to server
# Provides local API for debugging, monitoring, and policy management

# Operation mode: "standalone" or "agent-server"
mode: standalone

# Network interface to monitor
interface: ens33

# Logging configuration
log_level: info  # debug, info, warn, error

# Statistics reporting interval (seconds)
stats_interval: 30

# API Server Configuration (enabled by default in standalone mode)
api:
  enabled: true
  host: 0.0.0.0  # Listen on all interfaces for remote access
  port: 8080
  enable_cors: true

# Server configuration (not used in standalone mode)
# Can be omitted or left as null
server: null

# Flow Collection Configuration
flow:
  enabled: true
  storage_path: ./data/flows.db
  flow_timeout: 5m
  cleanup_interval: 1m
  retention_days: 7
