version: '3.8'

services:
  postgres:
    image: timescale/timescaledb:latest-pg14
    container_name: test-postgres
    environment:
      POSTGRES_USER: microsegment_user
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: microsegment
    ports:
      - "5432:5432"
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U microsegment_user -d microsegment"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - test-network

  server:
    build:
      context: ../../
      dockerfile: tests/e2e/Dockerfile.server
    container_name: test-server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=microsegment_user
      - DB_PASSWORD=secret
      - DB_NAME=microsegment
      - GRPC_PORT=9090
      - HTTP_PORT=8080
    ports:
      - "8080:8080"
      - "9090:9090"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - test-network

  agent:
    build:
      context: ../../
      dockerfile: tests/e2e/Dockerfile.agent
    container_name: test-agent
    depends_on:
      server:
        condition: service_healthy
    environment:
      - AGENT_ID=test-agent-001
      - SERVER_ADDR=server:9090
      - BATCH_SIZE=10
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    networks:
      - test-network

  test-runner:
    build:
      context: ../../
      dockerfile: tests/e2e/Dockerfile.test
    container_name: test-runner
    depends_on:
      - server
      - agent
    environment:
      - SERVER_URL=http://server:8080
      - POSTGRES_URL=postgres://microsegment_user:secret@postgres:5432/microsegment
    volumes:
      - ./test-results:/test-results
    networks:
      - test-network
    command: /bin/sh -c "sleep 10 && /app/run-tests.sh"

networks:
  test-network:
    driver: bridge
